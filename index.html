<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заметки</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; }
        form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        input { flex: 1; padding: 0.5rem; }
        ul { list-style: none; padding: 0; }
        li { padding: 0.5rem; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        button { cursor: pointer; padding: 0.3rem 0.8rem; }
        .note-text { cursor: pointer; flex: 1; }
    </style>
</head>
<body>
    <h1>📌 Мои заметки</h1>
    <form id="note-form">
        <input type="text" id="note-input" placeholder="Новая заметка..." required>
        <button type="submit">Добавить</button>
    </form>
    <ul id="notes-list"></ul>

    <script>
    const GIST_ID = '831e1765568d85619943cc93638c53e0';    // замени
    const GIST_TOKEN = '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'; // замени

    const API_URL = `https://api.github.com/gists/${GIST_ID}`;

    async function loadNotes() {
        try {
            const res = await fetch(API_URL, {
                headers: { Authorization: `token ${GIST_TOKEN}` }
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(`HTTP ${res.status}: ${err.message}`);
            }
            const gist = await res.json();
            // Проверяем, что файл db.json существует
            if (!gist.files || !gist.files['db.json']) {
                throw new Error('В gist нет файла db.json! Проверь имя файла.');
            }
            const data = JSON.parse(gist.files['db.json'].content);
            const notes = data.notes || [];
            const list = document.getElementById('notes-list');
            list.innerHTML = notes.map((note, index) => `
                <li>
                    <span class="note-text" onclick="editNote(${index}, '${escapeHtml(note)}')">${escapeHtml(note)}</span>
                    <button onclick="deleteNote(${index})">Удалить</button>
                </li>
            `).join('');
        } catch (err) {
            alert('Ошибка загрузки: ' + err.message);
            console.error(err);
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function updateNotes(modifyFn) {
        try {
            const res = await fetch(API_URL, {
                headers: { Authorization: `token ${GIST_TOKEN}` }
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(`HTTP ${res.status}: ${err.message}`);
            }
            const gist = await res.json();
            if (!gist.files || !gist.files['db.json']) {
                throw new Error('В gist нет файла db.json!');
            }
            const data = JSON.parse(gist.files['db.json'].content);
            modifyFn(data.notes || []);
            const updateRes = await fetch(API_URL, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `token ${GIST_TOKEN}`
                },
                body: JSON.stringify({
                    files: { 'db.json': { content: JSON.stringify(data) } }
                })
            });
            if (!updateRes.ok) {
                const err = await updateRes.json();
                throw new Error(`Ошибка сохранения: ${err.message}`);
            }
            loadNotes();
        } catch (err) {
            alert('Ошибка: ' + err.message);
            console.error(err);
        }
    }

    document.getElementById('note-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('note-input');
        const text = input.value.trim();
        if (!text) return;
        await updateNotes(notes => notes.push(text));
        input.value = '';
    });

    async function deleteNote(index) {
        await updateNotes(notes => notes.splice(index, 1));
    }

    async function editNote(index, oldText) {
        const newText = prompt('Изменить заметку:', oldText);
        if (newText !== null && newText.trim() !== '') {
            await updateNotes(notes => { notes[index] = newText.trim(); });
        }
    }

    loadNotes();
</script>
</body>
</html>
